; ============================================================================
;  <PRODUCT> — PlatformIO config built on ZDX CORE-0
;  Keep the envs you need, delete the rest. `native` runs logic/UI tests on PC.
; ============================================================================
[platformio]
default_envs = esp32

; Execution profile + features are set in include/board_config.h, not here.
[env]
; -Iinclude: the foundation library must see board_config.h too, or config.h silently falls back to
; its defaults (different queue sizes and feature flags than the app = ODR mismatch).
build_flags =
    -Wall -Wextra
    -Iinclude
    -Isrc
    -DFW_VERSION=\"0.1.0\"
    -DBOARD_REV=\"A\"
extra_scripts = pre:tools/git_rev.py
lib_ldf_mode = deep+
lib_extra_dirs = zdx-core0/lib   ; the foundation submodule: core0 (+ core0-testkit on native)
monitor_speed = 115200
test_framework = unity

[env:esp32]                 ; ESP32 / FireBeetle 2 ESP32-E
platform = espressif32
board = dfrobot_firebeetle2_esp32e
framework = arduino

[env:samd21]                ; ATSAMD21 (e.g. Seeed XIAO / Adafruit M0 class)
platform = atmelsam
board = seeed_xiao
framework = arduino

[env:stm32]                 ; STM32 via STM32duino
platform = ststm32
board = nucleo_l432kc
framework = arduino

[env:rp2040]                ; RP2040 (earlephilhower core gives dual-core + FreeRTOS)
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico
framework = arduino
board_build.core = earlephilhower

[env:native]                ; host build: the test kit's native port, unit tests, UI framebuffer dumps
platform = native
build_flags = ${env.build_flags} -DCORE0_NATIVE -std=gnu++11
test_build_src = yes
build_src_filter = +<*> -<main.cpp> -<drivers/> -<port/>
lib_compat_mode = off
