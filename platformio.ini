; ============================================================================
;  ZDX CORE-0 — foundation test project
;  native_core0 : the foundation suites (test/native/test_core0_*) on the host,
;                 with lib/core0 and the test kit (lib/core0_testkit: mocks + native port).
;  Needs a host GCC on PATH. Run: pio test -e native_core0
; ============================================================================
[platformio]
default_envs = native_core0
src_dir = kit/src          ; only build_info.cpp: the kit has no product code
include_dir = kit/include  ; board_config.h with the pilot's sizing, no pins

[env:native_core0]
platform = native
; -Ikit/include: the library must see the same board_config.h as the tests, or config.h falls
; back to its defaults (different queue sizes and feature flags = ODR mismatch).
build_flags =
    -Wall -Wextra
    -Ikit/include
    -DCORE0_NATIVE
    -std=gnu++11
extra_scripts = pre:templates/tools/git_rev.py
test_framework = unity
test_build_src = yes
test_filter = native/test_core0_*
lib_ldf_mode = deep+
lib_compat_mode = off
